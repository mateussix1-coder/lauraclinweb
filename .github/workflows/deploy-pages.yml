name: Publicar site Laura Clin
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Baixar arquivos
        uses: actions/checkout@v4
      - name: Configurar Pages ja habilitado no repositorio
        uses: actions/configure-pages@v5
      - name: Preparar apenas arquivos publicos
        run: |
          mkdir -p ./site-public
          cp index.html anuncios.html laura-clin-contato.vcf ./site-public/
          touch ./site-public/.nojekyll
      - name: Enviar arquivos para publicacao
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site-public
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
